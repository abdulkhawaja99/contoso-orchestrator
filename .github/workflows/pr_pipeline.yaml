name: PR Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Azure CLI
        uses: azure/setup-azure@v1

      - name: Login with OIDC
        uses: azure/login@v1
        with:
          clientId: ${{ secrets.AZURE_CLIENT_ID }}
          tenantId: ${{ secrets.AZURE_TENANT_ID }}
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Print Service Principal Object ID
        run: |
          echo "Service Principal Object ID: ${{ steps.oidc.outputs.object_id }}"

      - name: Run Deployment
        run: echo 'Deployment Step...'
